<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>우리 동네 대피소 지도</title>
<style>
  :root {
    --ink: #0f1d3a;
    --ink-soft: #35476b;
    --signal: #ffd400;
    --paper: #ffffff;
    --line: rgba(15, 29, 58, 0.12);
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", system-ui, sans-serif;
    color: var(--ink);
  }

  #map { width: 100%; height: 100%; }

  /* 현재 위치 버튼: 지도 앱에서 익숙한 우하단 원형 버튼 */
  #locateBtn {
    position: absolute;
    z-index: 12;
    right: 16px;
    bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
    height: 52px;
    padding: 0 18px 0 15px;
    border: 0;
    border-radius: 26px;
    background: var(--ink);
    color: var(--signal);
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(15, 29, 58, 0.3);
    transition: padding 0.25s ease, background 0.15s ease;
  }
  #locateBtn svg { flex: none; width: 22px; height: 22px; }
  #locateBtn:hover { background: #16294f; }
  #locateBtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #locateBtn:disabled { cursor: progress; }

  /* 한 번 쓰고 나면 라벨을 접어 아이콘만 남김 */
  #locateBtn.is-compact { padding: 0; width: 52px; justify-content: center; }
  #locateBtn.is-compact .label { display: none; }

  #locateBtn.is-busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 결과 카드: 찾기 전에는 아예 없음 */
  #panel {
    position: absolute;
    z-index: 10;
    left: 16px;
    top: 16px;
    width: 300px;
    max-width: calc(100% - 32px);
    max-height: calc(100% - 110px);
    display: none;
    flex-direction: column;
    background: var(--paper);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(15, 29, 58, 0.18);
    overflow: hidden;
  }
  #panel.is-open { display: flex; }

  #panelHead {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 13px 14px 11px 16px;
    border-bottom: 1px solid var(--line);
  }
  #panelTitle { flex: 1; font-size: 14px; font-weight: 700; margin: 0; }
  #closeBtn {
    flex: none;
    border: 0;
    background: none;
    padding: 2px 4px;
    font: inherit;
    font-size: 18px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
  }
  #closeBtn:focus-visible { outline: 2px solid var(--ink); }

  #status {
    margin: 0;
    padding: 10px 16px;
    font-size: 13px;
    line-height: 1.5;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--line);
  }
  #status:empty { display: none; }
  #status.is-error { color: #b3261e; }

  #result { list-style: none; margin: 0; padding: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #result li + li { border-top: 1px solid var(--line); }
  #result button {
    border: 0; background: none; width: 100%;
    padding: 12px 16px; font: inherit; text-align: left; cursor: pointer;
    display: flex; gap: 12px; align-items: baseline;
  }
  #result button:hover { background: #f3f5f9; }
  #result button:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }

  .rank { flex: none; width: 20px; font-size: 12px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .body { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; line-height: 1.35; word-break: keep-all; display: block; }
  .addr { margin-top: 3px; font-size: 12px; color: var(--ink-soft); line-height: 1.4; word-break: keep-all; display: block; }
  .dist { flex: none; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #result li:first-child .dist { color: #0a7d33; }

  .iw { padding: 10px 12px; font-size: 12px; line-height: 1.5; color: #333; min-width: 160px; word-break: keep-all; }
  .iw strong { font-size: 13px; }
  .iw .meta { color: #777; }
  .iw .away { color: #0a7d33; font-weight: 700; }

  @media (max-width: 480px) {
    #panel { left: 10px; right: 10px; top: 10px; width: auto; max-height: 45vh; }
    #locateBtn { right: 12px; bottom: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, #locateBtn.is-busy svg { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div id="panelHead">
      <h2 id="panelTitle">가까운 대피소</h2>
      <button id="closeBtn" type="button" aria-label="닫기">&times;</button>
    </div>
    <p id="status"></p>
    <ul id="result"></ul>
  </div>

  <button id="locateBtn" type="button" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="7"/>
      <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
      <path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke-linecap="round"/>
    </svg>
    <span class="label">가까운 대피소</span>
  </button>

  <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=2d2930c97c0980d7282447eca433bfe8"></script>
  <script>
  var map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(36.101850934215, 128.338441097864),
    level: 4
  });

  var locateBtn = document.getElementById('locateBtn');
  var panel = document.getElementById('panel');
  var statusEl = document.getElementById('status');
  var resultEl = document.getElementById('result');
  var closeBtn = document.getElementById('closeBtn');

  var shelters = [];
  var infowindow = new kakao.maps.InfoWindow({ zIndex: 3 });
  var myMarker = null, myAccuracy = null, routeLine = null;

  // 4:5 비율 마커
  var markerImage = new kakao.maps.MarkerImage('image.png', new kakao.maps.Size(32, 40));

  fetch('places.json')
    .then(function (response) { return response.json(); })
    .then(function (data) {
      data.forEach(function (item) {
        if (item["운영상태"] === "사용중지") return;

        var lat = parseFloat(item["위도(EPSG4326)"]);
        var lng = parseFloat(item["경도(EPSG4326)"]);
        if (!isFinite(lat) || !isFinite(lng)) return;

        var position = new kakao.maps.LatLng(lat, lng);
        var marker = new kakao.maps.Marker({ position: position, image: markerImage, map: map });

        var shelter = {
          name: item["시설명"] || '이름 없음',
          status: item["운영상태"] || '정보 없음',
          addr: item["도로명전체주소"] || item["소재지지번주소"] || '',
          lat: lat, lng: lng, position: position, marker: marker
        };
        shelters.push(shelter);

        kakao.maps.event.addListener(marker, 'mouseover', function () { openInfo(shelter); });
        kakao.maps.event.addListener(marker, 'mouseout', function () { infowindow.close(); });
        kakao.maps.event.addListener(marker, 'click', function () { openInfo(shelter); });
      });

      locateBtn.disabled = false;
      autoLocate();   // 이미 허락받은 적 있으면 알아서 실행
    })
    .catch(function (error) {
      console.error('데이터 로드 실패:', error);
      openPanel();
      setStatus('places.json을 읽을 수 없습니다. 파일을 웹 서버로 열었는지 확인하세요.', true);
    });

  // 권한이 이미 허용 상태면 버튼을 누르지 않아도 바로 찾아줌.
  // 아직 안 물어본 상태에서 창을 띄우면 대부분 반사적으로 거부하므로,
  // 그때는 버튼을 라벨과 함께 눈에 띄게 남겨둔다.
  function autoLocate() {
    if (!navigator.permissions || !navigator.permissions.query) return;
    navigator.permissions.query({ name: 'geolocation' })
      .then(function (result) {
        if (result.state === 'granted') {
          locate();
        }
        result.onchange = function () {
          if (result.state === 'granted') locate();
        };
      })
      .catch(function () { /* 미지원 브라우저는 버튼으로 */ });
  }

  locateBtn.addEventListener('click', locate);
  closeBtn.addEventListener('click', function () { panel.classList.remove('is-open'); });

  function locate() {
    if (!navigator.geolocation) {
      openPanel();
      setStatus('이 브라우저는 위치 기능을 지원하지 않습니다.', true);
      return;
    }
    locateBtn.disabled = true;
    locateBtn.classList.add('is-busy');

    navigator.geolocation.getCurrentPosition(onLocated, onLocateFail, {
      enableHighAccuracy: true, timeout: 10000, maximumAge: 30000
    });
  }

  function onLocated(pos) {
    resetButton();
    locateBtn.classList.add('is-compact');   // 한 번 썼으면 아이콘만 남김

    var myLat = pos.coords.latitude;
    var myLng = pos.coords.longitude;
    var myPosition = new kakao.maps.LatLng(myLat, myLng);

    if (!shelters.length) {
      openPanel();
      setStatus('표시할 대피소가 없습니다.', true);
      return;
    }

    if (myMarker) myMarker.setMap(null);
    if (myAccuracy) myAccuracy.setMap(null);

    myMarker = new kakao.maps.Marker({ position: myPosition, map: map, zIndex: 2 });
    myAccuracy = new kakao.maps.Circle({
      center: myPosition,
      radius: Math.max(pos.coords.accuracy || 0, 20),
      strokeWeight: 1, strokeColor: '#0f1d3a', strokeOpacity: 0.5,
      fillColor: '#0f1d3a', fillOpacity: 0.08, map: map
    });

    var ranked = shelters.map(function (s) {
      return { shelter: s, distance: distanceInMeters(myLat, myLng, s.lat, s.lng) };
    }).sort(function (a, b) { return a.distance - b.distance; });

    var top = ranked.slice(0, 3);
    var nearest = top[0];

    renderList(top);
    openPanel();
    setStatus('가장 가까운 곳은 ' + formatDistance(nearest.distance) + ' 거리입니다. (직선거리 기준)');

    if (routeLine) routeLine.setMap(null);
    routeLine = new kakao.maps.Polyline({
      path: [myPosition, nearest.shelter.position],
      strokeWeight: 4, strokeColor: '#0f1d3a', strokeOpacity: 0.7,
      strokeStyle: 'shortdash', map: map
    });

    var bounds = new kakao.maps.LatLngBounds();
    bounds.extend(myPosition);
    bounds.extend(nearest.shelter.position);
    map.setBounds(bounds, 80, 80, 80, 80);

    openInfo(nearest.shelter, nearest.distance);
  }

  function onLocateFail(err) {
    resetButton();
    openPanel();
    var message;
    if (err.code === 1) {
      message = '위치 권한이 거부되었습니다. 주소창의 자물쇠 아이콘에서 위치를 허용한 뒤 다시 눌러 주세요.';
    } else if (err.code === 2) {
      message = '위치를 확인할 수 없습니다. 실내라면 창가나 실외에서 다시 시도해 보세요.';
    } else if (err.code === 3) {
      message = '위치 확인이 시간 내에 끝나지 않았습니다. 다시 시도해 주세요.';
    } else {
      message = '위치를 가져오지 못했습니다.';
    }
    if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
      message += ' 위치 기능은 https 주소에서만 동작합니다.';
    }
    resultEl.innerHTML = '';
    setStatus(message, true);
  }

  function renderList(items) {
    resultEl.innerHTML = '';
    items.forEach(function (entry, index) {
      var li = document.createElement('li');
      var button = document.createElement('button');
      button.type = 'button';

      var rank = document.createElement('span');
      rank.className = 'rank';
      rank.textContent = String(index + 1);

      var body = document.createElement('span');
      body.className = 'body';

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = entry.shelter.name;
      body.appendChild(name);

      if (entry.shelter.addr) {
        var addr = document.createElement('span');
        addr.className = 'addr';
        addr.textContent = entry.shelter.addr;
        body.appendChild(addr);
      }

      var dist = document.createElement('span');
      dist.className = 'dist';
      dist.textContent = formatDistance(entry.distance);

      button.appendChild(rank);
      button.appendChild(body);
      button.appendChild(dist);
      button.addEventListener('click', function () {
        map.setLevel(3);
        map.panTo(entry.shelter.position);
        openInfo(entry.shelter, entry.distance);
      });

      li.appendChild(button);
      resultEl.appendChild(li);
    });
  }

  function openPanel() { panel.classList.add('is-open'); }

  function openInfo(shelter, distance) {
    var away = (typeof distance === 'number')
      ? '<div class="away">여기서 ' + formatDistance(distance) + '</div>' : '';
    infowindow.setContent(
      '<div class="iw"><strong>' + escapeHtml(shelter.name) + '</strong><br>' +
      '<span class="meta">상태: ' + escapeHtml(shelter.status) + '</span><br>' +
      '<span class="meta">' + escapeHtml(shelter.addr) + '</span>' + away + '</div>'
    );
    infowindow.open(map, shelter.marker);
  }

  function distanceInMeters(lat1, lng1, lat2, lng2) {
    var toRad = function (deg) { return deg * Math.PI / 180; };
    var R = 6371000;
    var dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
  }

  function formatDistance(m) {
    return m < 1000 ? Math.round(m) + 'm' : (m / 1000).toFixed(1) + 'km';
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = isError ? 'is-error' : '';
  }

  function resetButton() {
    locateBtn.disabled = false;
    locateBtn.classList.remove('is-busy');
  }

  function escapeHtml(text) {
    return String(text == null ? '' : text).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  </script>
</body>
</html>
