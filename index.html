<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>카카오맵 호스팅 테스트</title>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=여기에_자바스크립트_키_복사_붙여넣기"></script>
</head>
<body>
    <div id="map" style="width:100%;height:100vh;"></div>

    <script>
        var container = document.getElementById('map'); 
        var options = {
            center: new kakao.maps.LatLng(37.5665, 126.9780), // 서울시청 좌표
            level: 3 
        };

        // 3. 지도 생성
        var map = new kakao.maps.Map(container, options);
    </script>
</body>
</html>
