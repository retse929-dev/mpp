<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>로그인</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff; /* 라이트 모드 배경 */
      color: #333333; /* 라이트 모드 기본 글씨 */
      text-align: center;
      padding: 40px;
      transition: background-color 0.3s, color 0.3s;
    }

    h1 {
      color: #222222; /* 타이틀 글씨, 라이트 모드 */
    }

    h2 {
      color: #2c3e50; /* 라이트 모드 */
      transition: color 0.3s;
    }

    summary {
      color: #2c3e50; /* 라이트 모드 */
      transition: color 0.3s;
    }

    ul {
      text-align: left;
      display: inline-block;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .feature-box {
      background-color: #ffffff;
      padding: 20px;
      margin: 20px auto;
      border-radius: 12px;
      width: 60%;
      box-shadow: 0 6px 12px rgba(0,0,0,0.1);
      text-align: left;
      transition: background-color 0.3s, color 0.3s;
    }

    details {
      background-color: #ffffff;
      padding: 15px 20px;
      margin: 15px auto;
      border-radius: 10px;
      width: 60%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
      text-align: left;
      transition: background-color 0.3s, color 0.3s;
    }

    details p {
      margin-top: 10px;
      font-size: 16px;
      transition: color 0.3s;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      background-color: #2c3e50;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #34495e;
    }

    /* 로그인 모달 */
    #login-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    #login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      width: 300px;
      text-align: center;
      transition: background-color 0.3s, color 0.3s;
    }

    #login-box input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    /* 다크 모드 버튼 고정 */
    #dark-mode-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <h1>1</h1>

  <div class="feature-box">
    <h2>2</h2>
    <ul>
      <li>3</li>
      <li>3</li>
      <li>4</li>
    </ul>
  </div>

  <div class="feature-box">
    <h2>4</h2>
    <p>
      자바스크립트는 <strong>HTML, CSS와 함께 쓰여 웹페이지를 완성하고, 버튼 클릭이나 화면 동작 같은 기능을 구현할 수 있는 언어</strong>이다.
    </p>
  </div>

  <details>
    <summary>보기</summary>
    <p>3</p>
  </details>


  <div class="feature-box" style="text-align:center;">
    <h2>2</h2>
    <button onclick="openLogin()">로그인</button>
  </div>

  <div id="login-modal">
    <div id="login-box">
      <h2>로그인</h2>
      <input type="text" id="username" placeholder="아이디 입력">
      <input type="password" id="password" placeholder="비밀번호 입력">
      <br>
      <button onclick="login()">로그인</button>
      <button onclick="closeLogin()">닫기</button>
    </div>
  </div>

  <button id="dark-mode-btn" onclick="toggleDarkMode()">다크 모드 켜기/끄기</button>

  <script>
    const loginModal = document.getElementById("login-modal");

    function openLogin() {
      loginModal.style.display = "flex";
    }

    function closeLogin() {
      loginModal.style.display = "none";
    }

    function login() {
      const user = document.getElementById("username").value;
      const pass = document.getElementById("password").value;

      if (user === "user" && pass === "1234") {
        alert("로그인 성공!");
        closeLogin();
      } else {
        alert("로그인 실패! 아이디: user, 비밀번호: 1234");
      }
    }

    let darkMode = false;

    function toggleDarkMode() {
      const body = document.body;
      const boxes = document.querySelectorAll('.feature-box, details, #login-box');
      const h2s = document.querySelectorAll('h2');
      const summaries = document.querySelectorAll('summary');
      const detailsPs = document.querySelectorAll('details p');

      darkMode = !darkMode;

      if (darkMode) {
        body.style.backgroundColor = "#2c3e50"; // 진한 회색
        body.style.color = "#f2f2f2";           // 아주 약간 어두운 흰색
        boxes.forEach(b => b.style.backgroundColor = "#34495e");
        h2s.forEach(h => h.style.color = "#f2f2f2");
        summaries.forEach(s => s.style.color = "#f2f2f2");
        detailsPs.forEach(p => p.style.color = "#f2f2f2");
      } else {
        body.style.backgroundColor = "#ffffff"; // 흰색
        body.style.color = "#333333";           // 검은색
        boxes.forEach(b => b.style.backgroundColor = "#ffffff");
        h2s.forEach(h => h.style.color = "#2c3e50");
        summaries.forEach(s => s.style.color = "#2c3e50");
        detailsPs.forEach(p => p.style.color = "#333333");
      }
    }
  </script>

</body>
</html>
